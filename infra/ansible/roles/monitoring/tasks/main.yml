---
# Monitoring Stack Tasks
# - Deploy cAdvisor for container metrics
# - Deploy node-exporter for host metrics
# - Manage via systemd service

- name: Create monitoring directory
  ansible.builtin.file:
    path: "{{ app_base_dir }}/monitoring"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0750'

- name: Deploy monitoring Docker Compose configuration
  ansible.builtin.template:
    src: docker-compose.monitoring.yml.j2
    dest: "{{ app_base_dir }}/monitoring/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0640'
  notify: restart monitoring

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ app_base_dir }}/monitoring/prometheus.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0640'
  notify: restart monitoring

- name: Create monitoring systemd service
  ansible.builtin.template:
    src: monitoring.service.j2
    dest: /etc/systemd/system/{{ app_name }}-monitoring.service
    mode: '0644'
  notify:
    - reload systemd
    - restart monitoring

- name: Enable and start monitoring service
  ansible.builtin.systemd:
    name: "{{ app_name }}-monitoring"
    state: started
    enabled: true
    daemon_reload: true

- name: Display monitoring configuration summary
  ansible.builtin.debug:
    msg:
      - "==========================================="
      - "Monitoring Stack Deployed"
      - "==========================================="
      - "cAdvisor:      127.0.0.1:{{ monitoring_cadvisor_port | default('8081') }}"
      - "Node Exporter: 127.0.0.1:{{ monitoring_node_exporter_port | default('9100') }}"
      - "Prometheus:    127.0.0.1:{{ monitoring_prometheus_port | default('9090') }}"
      - "Grafana:       127.0.0.1:{{ monitoring_grafana_port | default('3001') }}"
      - ""
      - "All endpoints are localhost-only. Access via SSH tunnel:"
      - "ssh -L 3001:127.0.0.1:3001 root@{{ ansible_host }}"
      - "==========================================="
